<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SefwiGo</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f4f4f9;
      color: #333;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h1 {
      color: #2c3e50;
      text-align: center;
    }
    .menu-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }
    .menu-item:last-child {
      border-bottom: none;
    }
    #status {
      text-align: center;
      color: #666;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>SefwiGo Menu</h1>
    <div id="status">Loading menu items...</div>
    <div id="menu-list"></div>
  </div>

  <script>
    const sampleMenu = [
      { name: "Jollof Rice & Chicken", price: "GH₵ 40.00" },
      { name: "Fried Rice & Fish", price: "GH₵ 45.00" },
      { name: "Fufu with Goat Light Soup", price: "GH₵ 50.00" },
      { name: "Banku with Tilapia", price: "GH₵ 55.00" }
    ];

    function loadMenu() {
      const menuList = document.getElementById('menu-list');
      const status = document.getElementById('status');

      try {
        status.style.display = 'none';
        menuList.innerHTML = '';

        sampleMenu.forEach(item => {
          const div = document.createElement('div');
          div.className = 'menu-item';
          div.innerHTML = `<strong>${item.name}</strong> <span>${item.price}</span>`;
          menuList.appendChild(div);
        });
      } catch (error) {
        status.style.display = 'block';
        status.textContent = 'Could not load the menu. Please refresh.';
      }
    }

    document.addEventListener('DOMContentLoaded', loadMenu);
  </script>

</body>
</html>
